pluginManagement {
    // Find the Flutter SDK path from local.properties
    def flutterSdkPath = {
        def properties = new Properties()
        def propertiesFile = file("local.properties")

        if (propertiesFile.canRead()) {
            properties.load(new FileInputStream(propertiesFile))
            def flutterSdk = properties.getProperty("flutter.sdk")
            if (flutterSdk != null) {
                return flutterSdk
            }
        }

        // Use a standard Java exception to avoid GradleException import issues
        throw new IllegalStateException(
            "Flutter SDK not found. Define location with flutter.sdk in the local.properties file."
        )
    }()

    // This tells Gradle where to find the dev.flutter plugins
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Provided by the included Flutter build above
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"

    // Android + Kotlin + Google services plugin versions
    id "com.android.application" version "8.6.1" apply false
    id "com.android.library"     version "8.6.1" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
}

rootProject.name = "tremsolapp"
include(":app")
