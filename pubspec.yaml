name: tremsolapp
description: "A new Flutter project."

publish_to: "none"


#apple last
#version: 1.0.13+15
#version: 1.0.14+16

#android last
#version: 1.0.12+15

version: 1.0.15+17

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.7

  # Authentication
  google_sign_in: ^6.3.0
  flutter_facebook_auth: ^7.1.1
  sign_in_with_apple: ^7.0.1

  # State management and local storage
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5
  package_info_plus: ^8.1.1
  connectivity_plus: ^6.1.4
  internet_connection_checker: ^1.0.0+1
  permission_handler: ^11.4.0

  # User interface
  google_fonts: ^6.1.0
  flutter_staggered_grid_view: ^0.6.2
  carousel_slider: ^5.0.0
  cached_network_image: ^3.4.1
  shimmer: ^2.0.0
  flutter_rating_bar: ^4.0.1
  font_awesome_flutter: ^10.0.0
  flutter_html: ^3.0.0-beta.2
  auto_scroll: ^0.2.0

  # Video
  video_player: ^2.9.2
  chewie: ^1.8.5

  # Images and files
  image_picker: ^1.1.2
  image_cropper: ^9.1.0
  file_picker: ^8.1.6

  # Sharing, links and validation
  url_launcher: ^6.3.1
  share_plus: ^7.0.2
  intl: ^0.19.0
  email_validator: ^3.0.0
  flutter_email_sender: ^6.0.3
  mailer: ^6.4.1

  # Data files
  excel: ^4.0.6
  csv: ^6.0.0

  # Payments
  pay_with_paystack: ^1.0.10
  paystack_for_flutter: ^1.0.4

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  onesignal_flutter: ^5.6.5
  flutter_app_badger: ^1.5.0
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  
  change_app_package_name: ^1.4.0



  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/appicon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#FF6200"

flutter:
  uses-material-design: true

  assets:
    - images/jobs4.jpg
    - images/games.jpg
    - images/movies.jpg
    - images/fashion.jpg
    - assets/dialog_flow_auth.json
    - assets/google_icon.png
    - assets/logo.jpg
    - assets/facebook_icon.png
    - assets/apple_icon.png
    - assets/logoappbar.png

  fonts:
    - family: Schyler
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700